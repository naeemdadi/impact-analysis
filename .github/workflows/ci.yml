name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck and build
        run: pnpm build

      - name: Run tests with coverage
        run: pnpm test:coverage | tee coverage.txt

      - name: Security audit
        run: pnpm audit --audit-level=high

      - name: Publish coverage summary
        if: always()
        run: |
          {
            echo '### Test coverage'
            echo '```'
            sed -n '/start of coverage report/,/end of coverage report/p' coverage.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: coverage.lcov
          if-no-files-found: warn
